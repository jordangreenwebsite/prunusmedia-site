name: Client portal checks
on:
  pull_request:
    paths:
      - 'client-portal/**'
      - '.github/workflows/client-portal-checks.yml'
  push:
    paths:
      - 'client-portal/**'
      - '.github/workflows/client-portal-checks.yml'
jobs:
  test-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker and browser JS syntax
        working-directory: client-portal
        run: |
          node --check src/index.js
          node --check src/website-domain.js
          node --check src/editorial.js
          node --check src/gsc.js
          node --check src/research.js
          node --check src/mcp.js
          node --check src/github-pr.js
          node --check src/gbp.js
          node --check src/workspace-admin.js
          node --check src/content-requests.js
          node --check public/app.js
          node --check public/editorial-ui.js
          node --check public/workspace-ui.js
          node --check public/integrations-ui.js
          node --check public/portal-pages.js
      - name: Security and tenant isolation tests
        working-directory: client-portal
        run: node --experimental-sqlite --test tests/*.test.mjs
      - name: Validate Cloudflare Worker bundle (dry run; no deployment)
        working-directory: client-portal
        run: |
          npm install --no-audit --no-fund
          sed -i 's/REPLACE_WITH_REAL_CLOUDFLARE_D1_DATABASE_ID/00000000-0000-0000-0000-000000000000/' wrangler.jsonc
          npx wrangler deploy --dry-run --outdir /tmp/prunus-portal-dry-run
      - name: Check portal remains independently deployable
        run: |
          test -f client-portal/wrangler.jsonc
          test -f client-portal/migrations/0001_initial.sql
          test -f client-portal/migrations/0002_editorial.sql
          test -f client-portal/migrations/0003_integrations.sql
          test -f client-portal/migrations/0004_workspaces.sql
          test -f client-portal/EDITORIAL_POLICY.md
          test -f client-portal/public/index.html
