name: Deploy Prunus client portal (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prunus-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: portal-production
    defaults:
      run:
        working-directory: client-portal
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PRUNUS_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRUNUS_CLOUDFLARE_ACCOUNT_ID }}
      PORTAL_D1_DATABASE_ID: ${{ vars.PRUNUS_PORTAL_D1_DATABASE_ID }}
      PORTAL_AUTH_PEPPER: ${{ secrets.PRUNUS_AUTH_PEPPER }}
      PORTAL_RESEND_API_KEY: ${{ secrets.PRUNUS_RESEND_API_KEY }}
      PORTAL_ADMIN_EMAILS: ${{ secrets.PRUNUS_ADMIN_EMAILS }}
      PORTAL_ADMIN_NOTIFY_EMAIL: ${{ secrets.PRUNUS_ADMIN_NOTIFY_EMAIL }}
      PORTAL_OTP_FROM_EMAIL: ${{ vars.PRUNUS_OTP_FROM_EMAIL }}
    steps:
      - name: Check out reviewed production commit
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install portal dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker and browser syntax checks
        run: |
          node --check src/index.js
          node --check src/editorial.js
          node --check public/app.js
          node --check public/editorial-ui.js
          node --check scripts/prepare-deploy.mjs

      - name: Verify tenant isolation and editorial workflow
        run: node --experimental-sqlite --test tests/*.test.mjs

      - name: Validate account settings and prepare secrets without logging them
        run: node scripts/prepare-deploy.mjs

      - name: Apply production D1 migrations with Cloudflare backups
        run: npx wrangler d1 migrations apply prunus-website-clients --remote

      - name: Deploy Worker, assets, cron, domain and encrypted secrets
        run: npx wrangler deploy --secrets-file .portal-secrets.json

      - name: Remove transient secrets from runner
        if: always()
        run: rm -f .portal-secrets.json

      - name: Confirm deployment step completed
        run: |
          echo "Worker deployment command completed."
          echo "Real OTP, DNS, cross-tenant and website form acceptance tests are still mandatory before enabling client sign-in."
