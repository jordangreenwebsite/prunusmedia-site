name: Capture actual portfolio website screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/capture-website-previews.mjs'
      - 'src/data/industry-pages.mjs'
      - 'src/pages/industries/[slug].astro'
      - 'src/lib/standalone.mjs'
      - '.github/workflows/capture-website-previews.yml'

permissions:
  contents: write

jobs:
  capture:
    if: github.head_ref == 'fix/local-website-preview-screenshots' || github.head_ref == 'fix/pricing-no-emoji-roofing-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture real sites
        run: node scripts/capture-website-previews.mjs
      - name: Commit the static screenshots to this PR branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/website-previews/
          if ! git diff --staged --quiet; then
            git commit -m "Store captured website screenshots for industry hero previews"
            git push origin HEAD:refs/heads/${{ github.head_ref }}
          fi
      - name: Upload capture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industry-website-preview-capture-report
          path: website-preview-capture-report.json
          if-no-files-found: ignore
